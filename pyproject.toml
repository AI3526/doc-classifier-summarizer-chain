[project]
name = "doc-classifier-summarizer-chain"
version = "0.1.0"
description = "학습한 문서 분류기와 생성 LLM을 연결해 문서 유형별 요약을 제공하는 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7,<3",
  "transformers>=4.51,<5",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "langchain-core>=0.3.60,<2",
  "openai>=2,<3",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "psutil>=6,<8",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py312"
